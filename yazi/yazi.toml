

[opener]
edit = [
    { run = 'nvim "%s"', block = true, desc = "Neovim" },
]

open = [
    { run = 'xdg-open "$1"', desc = "Open with default application" },
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { url = "*.{py,pyx,pxd,pxi,c,h,cpp,hpp,cc,f,f90,f95,f03,for,rs,go,js,ts,jsx,tsx,json,jsonc,toml,yaml,yml,xml,ini,cfg,conf,sh,bash,zsh,lua,sql,md,markdown,txt,tex,bib,rst,html,css,scss,java,kt,rb,php,ipynb,gitignore,env}", use = "edit" },
    { mime = "image/*", use = "open" },
]
show_hidden = true
