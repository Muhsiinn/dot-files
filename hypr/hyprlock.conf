# Anya Forger Headquarters — lock screen
# The password field still authenticates through PAM.

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgb(12, 6, 9)
    blur_passes = 3
    blur_size = 8
}

# Crimson-glass card over the blurred desktop.
shape {
    monitor =
    size = 540, 440
    color = rgba(12, 6, 9, 0.74)
    border_size = 1
    border_color = rgb(138, 82, 97)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = ANYA FORGER HEADQUARTERS
    color = rgb(217, 140, 160)
    font_family = JetBrains Mono
    font_size = 10
    position = 0, 202
    halign = center
    valign = center
}

image {
    monitor =
    path = /home/anya/.config/hypr/anya-avatar.png
    size = 170
    border_size = 1
    border_color = rgb(138, 82, 97)
    rounding = 0
    position = 0, 105
    halign = center
    valign = center
}

label {
    monitor =
    text = ANYA NEEDS YOUR PASSWORD
    color = rgb(247, 235, 239)
    font_family = JetBrains Mono
    font_size = 20
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = Musi, authenticate to continue.
    color = rgb(185, 156, 165)
    font_family = JetBrains Mono
    font_size = 11
    position = 0, -48
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 46
    outline_thickness = 1
    inner_color = rgba(12, 6, 9, 0.88)
    outer_color = rgb(201, 106, 128)
    check_color = rgb(217, 140, 160)
    fail_color = rgb(255, 135, 155)
    capslock_color = rgb(255, 196, 120)
    font_color = rgb(247, 235, 239)
    font_family = JetBrains Mono
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text = HEADQUARTERS ACCESS KEY
    check_text = AUTHENTICATING...
    fail_text = ACCESS DENIED
    position = 0, -105
    halign = center
    valign = center
}

label {
    monitor =
    text = MUSI // CLEARANCE REQUIRED
    color = rgb(138, 82, 97)
    font_family = JetBrains Mono
    font_size = 9
    position = 0, -175
    halign = center
    valign = center
}
